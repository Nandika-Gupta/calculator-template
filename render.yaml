# Render Blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint > pick this repo. Render builds viralcut/Dockerfile and asks for the secret values below.
services:
  - type: web
    name: viralcut
    runtime: docker
    dockerfilePath: ./viralcut/Dockerfile
    dockerContext: .
    plan: standard          # 2 GB RAM - video rendering + Whisper need it (free 512 MB runs out of memory)
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false         # paste your key in the Render dashboard
      - key: VIRALCUT_PASSWORD
        sync: false         # password visitors must enter
      - key: VIRALCUT_WHISPER_MODEL
        value: base
      - key: VIRALCUT_DATA
        value: /data
    disk:
      name: viralcut-data
      mountPath: /data
      sizeGB: 20
