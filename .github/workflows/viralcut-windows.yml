name: ViralCut Windows app

on:
  push:
    paths:
      - "viralcut/**"
      - ".github/workflows/viralcut-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: viralcut/requirements.txt

      - name: Install dependencies
        run: pip install -r viralcut/requirements.txt pyinstaller httpx

      - name: Run unit tests
        run: python -m pytest viralcut/tests -q -p no:cacheprovider

      - name: Download FFmpeg and caption font
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build_assets/ffmpeg, build_assets/fonts | Out-Null
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_x
          Copy-Item ffmpeg_x/*/bin/* build_assets/ffmpeg/
          Copy-Item ffmpeg_x/*/LICENSE.txt build_assets/ffmpeg/FFMPEG-LICENSE.txt
          Invoke-WebRequest https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf -OutFile build_assets/fonts/Anton-Regular.ttf
          Invoke-WebRequest https://raw.githubusercontent.com/google/fonts/main/ofl/anton/OFL.txt -OutFile build_assets/fonts/OFL.txt
          Get-ChildItem build_assets -Recurse | Select-Object FullName, Length

      - name: Build ViralCut.exe
        run: pyinstaller --noconfirm --clean viralcut/packaging/viralcut.spec

      - name: Self-test the packaged app
        run: dist/ViralCut/ViralCut.exe --selftest

      - name: Build installer
        shell: pwsh
        run: |
          $version = python -c "import viralcut; print(viralcut.__version__)"
          "VIRALCUT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          $env:VIRALCUT_VERSION = $version
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" viralcut/packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist_installer | Select-Object Name, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ViralCut-Windows-Setup
          path: dist_installer/*.exe
          retention-days: 30

      - name: Publish download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: viralcut-v${{ env.VIRALCUT_VERSION }}
          name: ViralCut ${{ env.VIRALCUT_VERSION }} for Windows
          target_commitish: ${{ github.sha }}
          files: dist_installer/*.exe
          body: |
            **Download `ViralCut-Setup-${{ env.VIRALCUT_VERSION }}.exe` below, open it and follow the installer.**

            - Windows 10/11, 64-bit. Installs for your user only (no admin needed).
            - Windows may show "Windows protected your PC" because the app isn't code-signed: click **More info → Run anyway**.
            - Start ViralCut from the desktop or Start menu. It opens in your browser at http://127.0.0.1:8000.
            - Optional: click **Settings** in the app and paste your Claude API key for the best clips and posts.
